{{- /* Site-wide search: a 🔍 button next to the theme toggle opens an overlay.
       Uses PaperMod's bundled Fuse.js and the home page's index.json. */ -}}
{{- $fuse := resources.Get "js/fuse.basic.min.js" | fingerprint }}
<script defer src="{{ $fuse.RelPermalink }}" integrity="{{ $fuse.Data.Integrity }}"></script>

<div id="site-search" class="ss-overlay" hidden>
  <div class="ss-dialog" role="dialog" aria-modal="true" aria-label="Search">
    <div class="ss-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="ss-input" type="search" placeholder="Search posts and projects…" autocomplete="off"
        maxlength="64" aria-label="Search posts and projects" aria-controls="ss-results">
      <kbd class="ss-esc">Esc</kbd>
    </div>
    <ul id="ss-results" role="listbox" aria-label="Search results"></ul>
    <p id="ss-empty" class="ss-hint" hidden>No results.</p>
  </div>
</div>

<script>
(function () {
  var overlay = document.getElementById('site-search');
  var input = document.getElementById('ss-input');
  var list = document.getElementById('ss-results');
  var empty = document.getElementById('ss-empty');
  var fuse = null, loading = null, lastFocus = null, active = -1;

  // Search button as the last item of the main menu
  var btn = document.createElement('button');
  btn.id = 'search-toggle';
  btn.type = 'button';
  btn.title = 'Search (/)';
  btn.setAttribute('aria-label', 'Search');
  btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle>' +
    '<line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
  var menu = document.getElementById('menu');
  if (menu) {
    var li = document.createElement('li');
    li.appendChild(btn);
    menu.appendChild(li);
  }

  function load() {
    if (loading) return loading;
    loading = fetch('{{ "index.json" | relLangURL }}')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        fuse = new Fuse(data, { keys: ['title', 'summary', 'content'], threshold: 0.4, ignoreLocation: true });
      })
      .catch(function () { loading = null; });
    return loading;
  }

  // index.json holds HTML entities (e.g. &rsquo;); decode to text, then escape for output
  var decoder = document.createElement('textarea');
  function esc(s) {
    decoder.innerHTML = String(s || '');
    return decoder.value.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function section(url) {
    if (url.indexOf('/projects/') !== -1) return 'Project';
    if (url.indexOf('/posts/') !== -1) return 'Blog';
    return 'Page';
  }

  function render() {
    var q = input.value.trim();
    active = -1;
    if (!q || !fuse) { list.innerHTML = ''; empty.hidden = true; return; }
    var hits = fuse.search(q, { limit: 8 });
    empty.hidden = hits.length > 0;
    list.innerHTML = hits.map(function (h, i) {
      var it = h.item;
      return '<li role="option" id="ss-opt-' + i + '"><a href="' + esc(it.permalink) + '">' +
        '<span class="ss-sec">' + section(it.permalink) + '</span>' +
        '<span class="ss-title">' + esc(it.title) + '</span>' +
        (it.summary ? '<span class="ss-sum">' + esc(it.summary) + '</span>' : '') + '</a></li>';
    }).join('');
  }

  function move(d) {
    var items = list.querySelectorAll('li');
    if (!items.length) return;
    active = (active + d + items.length) % items.length;
    items.forEach(function (li, i) { li.classList.toggle('active', i === active); });
    input.setAttribute('aria-activedescendant', 'ss-opt-' + active);
    items[active].scrollIntoView({ block: 'nearest' });
  }

  function open() {
    lastFocus = document.activeElement;
    overlay.hidden = false;
    document.body.classList.add('ss-lock');
    input.focus();
    input.select();
    load().then(render);
  }
  function close() {
    overlay.hidden = true;
    document.body.classList.remove('ss-lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  btn.addEventListener('click', open);
  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
  input.addEventListener('input', render);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') {
      var link = list.querySelector('li.active a') || list.querySelector('li a');
      if (link) { e.preventDefault(); window.location.href = link.href; }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!overlay.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      if (e.key === 'Tab') { e.preventDefault(); input.focus(); } // keep focus inside the dialog
      return;
    }
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey))) {
      e.preventDefault();
      open();
    }
  });
})();
</script>
